name: Update Dashboards

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-nsoc-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build NSOC Dashboard
        env:
          NSOC_CREDS: ${{ secrets.NSOC_CREDS }}
        run: |
          echo "$NSOC_CREDS" > ~/.nsoc_creds
          python3 iot-camera/scripts/build-nsoc-dash.py

      - name: Commit & push
        run: |
          git config user.name "nsoc-bot"
          git config user.email "nsoc-bot@retailmedia"
          git add Retail-Media-Nsoc-Players.html
          git diff --staged --quiet || git commit -m "Auto-update $(date '+%Y-%m-%d %H:%M UTC')"
          git push
