<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retail Media · IoT Status</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#08080e;color:#f1f5f9;padding:0 0 40px}
#app{max-width:1000px;margin:0 auto;padding:24px}

/* Header */
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.hd h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.hd h1 span{color:#64748b;font-weight:400}
.hd .ts{font-size:11px;color:#52525b;font-family:monospace}

/* Metrics row */
.mr{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap}
.mi{background:#111827;border:1px solid #1e293b;border-radius:8px;padding:14px 18px;min-width:110px;flex:1}
.mi .mv{font-size:28px;font-weight:800;line-height:1.1}
.mi .ml{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;font-weight:500}
.mi .mv.blue{color:#60a5fa}.mi .mv.green{color:#4ade80}.mi .mv.orange{color:#facc15}.mi .mv.red{color:#f87171}.mi .mv.purple{color:#a78bfa}

/* Brand section */
.brand{margin-bottom:20px;background:#111827;border-radius:12px;border:1px solid #1e293b;overflow:hidden}
.brand-hdr{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid #1e293b;gap:12px}
.brand-hdr .logo{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
.brand-hdr .logo.uc{background:#2563eb}.brand-hdr .logo.lulu{background:#dc2626}
.brand-hdr h2{font-size:16px;font-weight:700}
.brand-hdr .bs{display:flex;gap:12px;margin-left:auto;font-size:11px;color:#64748b}
.brand-hdr .bs .bv{font-weight:700;color:#e2e8f0;font-size:13px}
.brand-hdr .bs .bv.gr{color:#4ade80}
.brand-body{padding:14px 20px 18px}

/* Venue sub-cards */
.venue{margin-bottom:12px}
.venue:last-child{margin-bottom:0}
.vh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.vh .vn{font-size:13px;font-weight:600;color:#e2e8f0}
.vh .vn .loc{display:block;font-size:10px;color:#52525b;font-weight:400;margin-top:1px}
.vh .vcount{font-size:14px;font-weight:700;color:#94a3b8}
.vg{display:flex;gap:6px}
.vi{flex:1;background:#0f1117;border:1px solid #1a1d29;border-radius:6px;padding:10px 0;text-align:center}
.vi .il{font-size:9px;text-transform:uppercase;color:#52525b;letter-spacing:.8px;font-weight:500}
.vi .iv{font-size:22px;font-weight:800;margin-top:2px}
.vi .iv.gr{color:#4ade80}.vi .iv.ye{color:#facc15}.vi .iv.re{color:#f87171}

/* Alerts */
.al{margin-top:8px;padding:10px 14px 8px;background:#1a1a2e;border-radius:8px;border:1px solid #2d1b1b}
.al .ah{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;font-weight:600;color:#fca5a5}
.al .ah .ac{background:#450a0a;color:#f87171;padding:0 8px;border-radius:10px;font-size:10px;margin-left:auto}
.at{width:100%;border-collapse:collapse;font-size:11px}
.at th{padding:6px 8px;color:#52525b;font-weight:500;text-align:left;border-bottom:1px solid #1e293b;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.at td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04);color:#94a3b8}
.at .stt{color:#4ade80;font-weight:600}
.at .er{color:#f87171;font-weight:600}
.at .wr{color:#facc15;font-weight:600}

.ft{text-align:center;padding:16px;color:#1e293b;font-size:10px}
</style>
</head>
<body>
<div id="app">

<div class="hd">
  <h1>Retail Media <span>· IoT Status</span></h1>
  <div class="ts" id="ts">—</div>
</div>

<div class="mr" id="metrics"></div>

<div class="brand" id="unionCoop">
  <div class="brand-hdr">
    <div class="logo uc">U</div>
    <h2>Union Coop</h2>
    <div class="bs"></div>
  </div>
  <div class="brand-body" id="ucBody"></div>
</div>

<div class="brand" id="luluMarket">
  <div class="brand-hdr">
    <div class="logo lulu">L</div>
    <h2>Lulu Market</h2>
    <div class="bs"></div>
  </div>
  <div class="brand-body" id="luluBody"></div>
</div>

<div class="al" id="alerts" style="display:none">
  <div class="ah">
    <span>Devices needing attention</span>
    <span class="ac" id="alertCount">0</span>
  </div>
  <table class="at"><thead><tr><th>Device</th><th>Venue</th><th>State</th><th>Errors</th><th>Warnings</th></tr></thead>
    <tbody id="alertBody"></tbody>
  </table>
</div>

<div class="ft">AiOO Tech Dubai · IoT Admin Console</div>
</div>

<script>
// ===== GRAFANA API =====
const BASE = 'https://nsoc.aiootech.com/grafana';
const TOKEN = 'glsa_X5Mt58Yj2tF4xVLn502CHh6SODGm56Vz_76545fb7';
const DS = 'afgjq2q0g0000c';

async function gq(sql) {
  const r = await fetch(BASE+'/api/ds/query', {
    method:'POST',
    headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},
    body:JSON.stringify({queries:[{refId:'A',datasource:{uid:DS,type:'mysql'},rawSql:sql,format:'table',rawQuery:true,editorMode:'code'}]})
  });
  const d = await r.json();
  return d?.results?.A?.frames?.[0]?.data?.values;
}

// ===== STATE =====
let deviceData = [];
const VENUES = {
  'Union Coop UMM SUQEIM': {group:'uc', label:'Umm Suqeim'},
  'Union Coop AL WARQA': {group:'uc', label:'Al Warqa'},
  'Union Coop AL BARSHA': {group:'uc', label:'Al Barsha'},
  'Union Coop AL BARSHA SOUTH': {group:'uc', label:'Al Barsha South'},
  'Union Coop MIRDIF': {group:'uc', label:'Mirdif'},
  'Union Coop JUMEIRAH': {group:'uc', label:'Jumeirah'},
  'Union Coop JUMEIRAH-1': {group:'uc', label:'Jumeirah-1'},
  'Union Coop AL WASL': {group:'uc', label:'Al Wasl'},
  'LULU AL WAHDA': {group:'lulu', label:'Al Wahda'},
  'LULU AL KHALIDIYA': {group:'lulu', label:'Al Khalidiya'},
  'LULU AL KHALIFA': {group:'lulu', label:'Al Khalifa'},
  'LULU MUSHRIF': {group:'lulu', label:'Mushrif'},
  'LULU WTC AUH': {group:'lulu', label:'WTC AUH'},
};

function fmtTime(){return new Date().toLocaleString('en-GB',{hour12:false})}

function venueData(devices, group) {
  const venues = {};
  devices.forEach(d => {
    const v = VENUES[d.venue];
    if (!v || v.group !== group) return;
    const key = d.venue;
    if (!venues[key]) venues[key] = {label:v.label, devices:[], tracking:0, warn:0, err:0};
    venues[key].devices.push(d);
    const state = (d.state||'').toUpperCase();
    if (state.includes('TRACK')) venues[key].tracking++;
    else if (state.includes('WARN')) venues[key].warn++;
    else venues[key].err++;
  });
  return Object.values(venues).sort((a,b)=>b.devices.length - a.devices.length);
}

function render() {
  document.getElementById('ts').textContent = fmtTime();

  // Metrics
  const total = deviceData.length;
  const tracking = deviceData.filter(d => (d.state||'').toUpperCase().includes('TRACK')).length;
  const warn = deviceData.filter(d => (d.state||'').toUpperCase().includes('WARN')).length;
  const errs = deviceData.filter(d => {
    const s = (d.state||'').toUpperCase();
    return !s.includes('TRACK') && !s.includes('WARN');
  }).length;

  document.getElementById('metrics').innerHTML = `
    <div class="mi"><div class="mv blue">${total}</div><div class="ml">Total Devices</div></div>
    <div class="mi"><div class="mv green">${tracking}</div><div class="ml">Tracking OK</div></div>
    <div class="mi"><div class="mv orange">${warn}</div><div class="ml">Warnings</div></div>
    <div class="mi"><div class="mv red">${errs}</div><div class="ml">Errors</div></div>
  `;

  // Union Coop
  const uc = venueData(deviceData, 'uc');
  const ucTotal = uc.reduce((s,v) => s+v.devices.length, 0);
  const ucOk = uc.reduce((s,v) => s+v.tracking, 0);
  document.getElementById('unionCoop').querySelector('.bs').innerHTML =
    `<span><span class="bv">${ucTotal}</span> devices</span><span><span class="bv gr">${ucOk}</span> ok</span>`;
  document.getElementById('ucBody').innerHTML = uc.map(v => `
    <div class="venue">
      <div class="vh"><span class="vn">${v.label}</span><span class="vcount">${v.devices.length}</span></div>
      <div class="vg">
        <div class="vi"><div class="il">Tracking</div><div class="iv gr">${v.tracking}</div></div>
        <div class="vi"><div class="il">Warnings</div><div class="iv ye">${v.warn}</div></div>
        <div class="vi"><div class="il">Errors</div><div class="iv re">${v.err||'0'}</div></div>
      </div>
    </div>`).join('');

  // Lulu Market
  const lu = venueData(deviceData, 'lulu');
  const luTotal = lu.reduce((s,v) => s+v.devices.length, 0);
  const luOk = lu.reduce((s,v) => s+v.tracking, 0);
  document.getElementById('luluMarket').querySelector('.bs').innerHTML =
    `<span><span class="bv">${luTotal}</span> devices</span><span><span class="bv gr">${luOk}</span> ok</span>`;
  document.getElementById('luluBody').innerHTML = lu.map(v => `
    <div class="venue">
      <div class="vh"><span class="vn">${v.label}</span><span class="vcount">${v.devices.length}</span></div>
      <div class="vg">
        <div class="vi"><div class="il">Tracking</div><div class="iv gr">${v.tracking}</div></div>
        <div class="vi"><div class="il">Warnings</div><div class="iv ye">${v.warn}</div></div>
        <div class="vi"><div class="il">Errors</div><div class="iv re">${v.err||'0'}</div></div>
      </div>
    </div>`).join('');

  // Alerts
  const alerts = deviceData.filter(d => {
    const s = (d.state||'').toUpperCase();
    return s.includes('WARN') || (!s.includes('TRACK') && !s.includes('WARN') && !s.includes('ONLINE'));
  });
  const alertEl = document.getElementById('alerts');
  if (alerts.length > 0) {
    alertEl.style.display = 'block';
    document.getElementById('alertCount').textContent = alerts.length;
    document.getElementById('alertBody').innerHTML = alerts.slice(0,10).map(d => `
      <tr><td>${d.name||'-'}</td><td>${d.venue||'-'}</td>
      <td class="stt">${d.state||'UNKNOWN'}</td>
      <td class="er">${d.errors||'0'}</td>
      <td class="wr">${d.warnings||'0'}</td></tr>`).join('');
  } else {
    alertEl.style.display = 'none';
  }
}

async function fetchData() {
  try {
    const v = await gq("SELECT comp.name, loc.completename, comp.states_id FROM glpi_computers comp LEFT JOIN glpi_locations loc ON comp.locations_id=loc.id WHERE loc.completename IS NOT NULL AND comp.is_deleted=0");
    if (v && v[0]) {
      deviceData = v[0].map((_,i) => ({
        name: v[0][i],
        venue: v[1][i],
        state: v[2][i] === '1' ? 'TRACKING' : v[2][i] === '7' ? 'OFFLINE' : 'UNKNOWN',
        errors: '0',
        warnings: '0'
      }));
    }
  } catch(e) { console.log('API error:', e.message); }
  render();
}

fetchData();
setInterval(fetchData, 300000);
</script>
</body>
</html>
