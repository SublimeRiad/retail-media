<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>IOT Dashboard — Live API</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#0d1117;color:#e2e8f0;min-height:100vh;padding:0;font-size:14px}
.hdr{padding:16px 24px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:18px;font-weight:600;color:#e2e8f0}
.hdr .ts{color:#52525b;font-size:11px;font-family:monospace}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:16px 24px}
.sc{background:#161b22;border-radius:10px;border:1px solid #1e293b;padding:14px 16px;text-align:center}
.sc .sv{font-size:28px;font-weight:800;line-height:1.2}
.sc .sl{font-size:10px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.sc.b .sv{color:#60a5fa}.sc.g .sv{color:#4ade80}.sc.r .sv{color:#f87171}
.content{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 24px 24px}@media(max-width:900px){.content{grid-template-columns:1fr}}
.card{background:#161b22;border-radius:12px;border:1px solid #1e293b;overflow:hidden}
.card .ch{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #1e293b}
.card .ch h3{font-size:13px;font-weight:600;color:#e2e8f0}
.card .ch .ch-sub{font-size:10px;color:#64748b}
.card-body{padding:16px}
.state-list{display:flex;flex-direction:column;gap:10px}
.sr{display:flex;align-items:center;gap:10px}
.sr .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.sr .nm{flex:1;color:#94a3b8;font-size:13px}
.sr .vl{font-weight:700;font-size:15px;color:#e2e8f0;min-width:30px;text-align:right}
.sr .br{flex:1;height:8px;background:#1e293b;border-radius:4px;overflow:hidden;max-width:200px}
.sr .bf{height:100%;border-radius:4px;transition:width .5s}
.v-list{display:flex;flex-direction:column;gap:6px;max-height:450px;overflow-y:auto}
.vr{padding:8px 12px;border-radius:6px;border:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.vr .vn{color:#e2e8f0;font-weight:500}
.vr .vc{color:#64748b}
.table-wrap{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 16px;text-align:left;color:#64748b;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1e293b}
.tbl td{padding:10px 16px;border-bottom:1px solid #1e293b;color:#94a3b8}
.tbl tr:hover td{background:#1e293b40}
.st-o{color:#f87171;font-weight:700}.st-r{color:#4ade80}.st-t{color:#3b82f6}.st-i{color:#facc15}
.flash{position:fixed;bottom:20px;right:20px;background:#161b22;border:1px solid #1e293b;border-radius:8px;padding:10px 16px;font-size:12px;color:#64748b;opacity:0;transition:opacity .3s;z-index:999}
.flash.show{opacity:1}
</style>
</head>
<body>
<div class="hdr"><h1>⏺ IoT Wall — Live API</h1><span class="ts" id="ts">Loading...</span></div>
<div class="summary" id="summary"></div>
<div class="content" id="content"></div>
<div class="flash" id="flash"></div>

<script>
const CLIENT_ID = 'b13b77ae-3d68-4560-9bf0-5de9780218b2';
const CLIENT_SECRET = 'hsdf2sdFE5g75ze2%sgD5s4dg';
const API_URL = 'https://apim-eu-1.aiootech.com/v1/iot/status/current';
const REFRESH_MS = 300000; // 5 min

function $(id) { return document.getElementById(id); }

function flash(msg) {
  const f = $('flash');
  f.textContent = msg;
  f.classList.add('show');
  setTimeout(() => f.classList.remove('show'), 3000);
}

function stateClass(s) {
  const map = { 'Offline':'st-o', 'Ready':'st-r', 'Tracking':'st-t', 'Idle':'st-i', 'Unknown':'' };
  return map[s] || '';
}

function render(devices) {
  const now = new Date().toLocaleString('en-GB', { timeZone:'Asia/Dubai', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }) + ' GST';
  $('ts').textContent = 'Updated: ' + now;

  // Count states
  const states = {};
  const venueMap = {};
  let attention = [];
  for (const d of devices) {
    const s = d.state || 'Unknown';
    states[s] = (states[s] || 0) + 1;
    const v = (d.venue || '').split('|')[0].trim() || 'Unknown';
    if (!venueMap[v]) venueMap[v] = { total:0, offline:0 };
    venueMap[v].total++;
    const sk = s.toLowerCase();
    if (sk === 'offline') {
      venueMap[v].offline++;
      attention.push(d);
    }
  }

  // Sort offline by last_seen descending
  attention.sort((a,b) => {
    const parse = s => {
      if (!s) return 0;
      const m = s.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)/);
      return m ? new Date(m[3],m[2]-1,m[1],m[4],m[5],m[6]).getTime() : 0;
    };
    return parse(b.last_seen) - parse(a.last_seen);
  });

  const total = devices.length;
  const offline = states['Offline'] || 0;
  const online = total - offline;
  const venueCount = Object.keys(venueMap).length;

  // Summary cards
  const cards = [
    { val:total, lbl:'Total devices', cls:'b' },
    { val:online, lbl:'Online', cls:'g' },
    { val:offline, lbl:'Offline', cls:'r' },
    { val:venueCount, lbl:'Venues', cls:'b' },
    { val:attention.length, lbl:'Attention', cls:'r' },
  ];
  $('summary').innerHTML = cards.map(c => `<div class="sc ${c.cls}"><div class="sv">${c.val}</div><div class="sl">${c.lbl}</div></div>`).join('');

  // State breakdown + Venue list
  const stateColors = { 'Offline':'#f87171', 'Ready':'#4ade80', 'Tracking':'#3b82f6', 'Idle':'#facc15', 'Unknown':'#52525b' };
  const stateOrder = ['Ready','Tracking','Idle','Offline','Unknown'];
  const maxState = Math.max(...stateOrder.map(s => states[s]||0), 1);

  const sortedVenues = Object.entries(venueMap).sort((a,b) => b[1].total - a[1].total);

  $('content').innerHTML = `
    <div class="card"><div class="ch"><h3>Device by state</h3><span class="ch-sub">${total} total</span></div>
      <div class="card-body"><div class="state-list">
        ${stateOrder.filter(s => states[s]).map(s => `
          <div class="sr"><div class="dot" style="background:${stateColors[s]}"></div>
          <span class="nm">${s}</span><div class="br"><div class="bf" style="width:${(states[s]/maxState*100).toFixed(0)}%;background:${stateColors[s]}"></div></div>
          <span class="vl">${states[s]}</span></div>
        `).join('')}
      </div></div>
    </div>
    <div class="card"><div class="ch"><h3>Venues</h3><span class="ch-sub">${venueCount} total</span></div>
      <div class="card-body"><div class="v-list">
        ${sortedVenues.map(([v,c]) => `<div class="vr"><span class="vn">${v}</span><span class="vc">${c.total} devices${c.offline ? ' · ' + c.offline + ' offline' : ''}</span></div>`).join('')}
      </div></div>
    </div>
  `;

  // Offline table
  const tableWrap = document.createElement('div');
  tableWrap.className = 'card table-wrap';
  tableWrap.innerHTML = `
    <div class="ch"><h3>⚠ Devices needing attention</h3><span class="ch-sub">${attention.length} device${attention.length!==1?'s':''}</span></div>
    <div style="max-height:600px;overflow-y:auto">
    <table class="tbl">
      <thead><tr><th>Device</th><th>Venue</th><th>Location</th><th>Platform</th><th>State</th><th>Last seen</th></tr></thead>
      <tbody>${attention.map(d => {
        const parts = (d.venue || '—').split('|');
        const venue = parts[0]?.trim() || '—';
        const loc = parts.slice(1).join('|').trim() || '—';
        const lastSeen = d.last_seen || '—';
        return `<tr><td style="font-family:monospace;font-size:11px">${d.aioo_id || d.mac || d.device || '—'}</td><td>${esc(venue)}</td><td>${esc(loc)}</td><td style="font-family:monospace;font-size:11px">${d.platform || '—'}</td><td class="${stateClass(d.state)}">${d.state || ''}</td><td>${lastSeen}</td></tr>`;
      }).join('')}</tbody>
    </table></div>`;
  $('content').appendChild(tableWrap);
}

function esc(s) { return s ? String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]) : ''; }

async function fetchData() {
  try {
    const r = await fetch(API_URL, {
      headers: { 'client_id':CLIENT_ID, 'client_secret':CLIENT_SECRET, 'Accept':'application/json' }
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    render(data);
    flash('✅ Updated ' + new Date().toLocaleTimeString());
  } catch(e) {
    $('ts').textContent = 'Error: ' + e.message;
    flash('❌ Error: ' + e.message);
  }
}

fetchData();
setInterval(fetchData, REFRESH_MS);
</script>
</body>
</html>
