<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>IOT Dashboard — Wall Display (Live API)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#0d1117;color:#e2e8f0;min-height:100vh;padding:0}

.hdr{padding:16px 24px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:18px;font-weight:600;color:#e2e8f0}
.hdr .ts{color:#52525b;font-size:11px;font-family:monospace}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 24px}
.sc{background:#161b22;border-radius:10px;border:1px solid #1e293b;padding:14px 16px;text-align:center}
.sc .sv{font-size:32px;font-weight:800;line-height:1.2}
.sc .sl{font-size:11px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.sc.b .sv{color:#60a5fa}.sc.g .sv{color:#4ade80}.sc.r .sv{color:#f87171}.sc.p .sv{color:#a78bfa}

.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:0 24px}
@media(max-width:1200px){.grid{grid-template-columns:1fr}}

.chart-card{background:#161b22;border-radius:12px;border:1px solid #1e293b;overflow:hidden}
.chart-card .ch{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #1e293b}
.chart-card .ch h3{font-size:12px;font-weight:600;color:#e2e8f0}
.chart-card .ch .ch-sub{font-size:10px;color:#64748b}
.chart-body{padding:16px}

.chart-wrap{display:flex;align-items:center;gap:24px;justify-content:center}
.chart-svg{width:160px;height:160px;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:8px;min-width:110px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:12px}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg-label{color:#94a3b8;flex:1;white-space:nowrap}
.leg-val{font-weight:700;font-size:14px;color:#e2e8f0}
.leg-pct{font-size:9px;color:#52525b;margin-left:3px}

.table-wrap{padding:16px 24px 24px}
.tc{background:#161b22;border-radius:12px;border:1px solid #1e293b;overflow:hidden}
.thdr{padding:14px 18px;font-size:13px;font-weight:600;color:#fca5a5;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between}
.thdr .sub{color:#64748b;font-size:11px;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:10px 16px;text-align:left;color:#64748b;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1e293b}
td{padding:10px 16px;border-bottom:1px solid #1e293b;color:#94a3b8}
tr:hover td{background:#1e293b40}
.st-o{color:#f87171;font-weight:700}
</style>
</head>
<body>
<div class="hdr"><h1>IOT Dashboard — Wall Display</h1><span class="ts" id="ts">Loading...</span></div>
<div class="summary" id="summary"></div>
<div class="grid" id="content"></div>
<div class="table-wrap" id="tableWrap"></div>

<script>
const CLIENT_ID = 'b13b77ae-3d68-4560-9bf0-5de9780218b2';
const CLIENT_SECRET = '***';
const API_URL = 'https://apim-eu-1.aiootech.com/v1/iot/status/current';

function esc(s) { return s ? String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]) : ''; }

function donutSvg(data, total) {
  if (!total) return '<svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="90" fill="none" stroke="#27272a" stroke-width="35"/></svg>';
  const R = 90, cx = 120, cy = 120, circ = 2 * Math.PI * R;
  let cur = 0;
  const arcs = data.map(d => {
    const pct = d.v / total;
    const len = Math.max(circ * pct, 0.5);
    const off = -(cur / total) * circ;
    cur += pct;
    return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${d.c}" stroke-width="35" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<svg viewBox="0 0 240 240"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#27272a" stroke-width="35"/>${arcs}<text x="${cx}" y="${cy+6}" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="800">${total}</text><text x="${cx}" y="${cy+28}" text-anchor="middle" fill="#64748b" font-size="11">devices</text></svg>`;
}

function parseDate(s) {
  if (!s) return 0;
  const m = s.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)/);
  return m ? new Date(m[3], m[2]-1, m[1], m[4], m[5], m[6]).getTime() : 0;
}

function render(devices) {
  const now = new Date().toLocaleString('en-GB',{timeZone:'Asia/Dubai',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' GST';
  document.getElementById('ts').textContent = 'Last update: '+now;

  const states = {};
  const platforms = {};
  const camTypes = {};
  let offline = [];

  for (const d of devices) {
    const s = d.state || 'Unknown';
    states[s] = (states[s]||0)+1;
    const p = (d.platform||'unknown').toLowerCase();
    platforms[p] = (platforms[p]||0)+1;
    const c = d.camera || 'Unknown';
    if (c) camTypes[c] = (camTypes[c]||0)+1;
    if (s === 'Offline') offline.push(d);
  }

  const total = devices.length;
  const offCount = states['Offline']||0;

  // Top 14 most recent offline
  offline.sort((a,b) => parseDate(b.last_seen) - parseDate(a.last_seen));
  const attention = offline.slice(0, 14);

  // Colors
  const stateColors = {'Ready':'#4ade80','Tracking':'#3b82f6','Idle':'#facc15','Offline':'#ef4444','Unknown':'#52525b'};
  const platPalette = ['#06b6d4','#22c55e','#3b82f6','#6366f1','#f59e0b','#14b8a6','#8b5cf6','#0891b2','#52525b'];
  const camPalette = ['#06b6d4','#22c55e','#3b82f6','#6366f1','#f59e0b','#14b8a6','#52525b'];

  // Summary cards
  const venueCount = Object.keys(devices.reduce((a,d)=>{a[(d.venue||'').split('|')[0].trim()||'?']=1;return a},{})).length;
  document.getElementById('summary').innerHTML = [
    {v:total,l:'Total devices',c:'b'},{v:total-offCount,l:'Online',c:'g'},{v:offCount,l:'OFFLINE',c:'r'},
    {v:venueCount,l:'Venues',c:'b'}
  ].map(x=>`<div class="sc ${x.c}"><div class="sv">${x.v}</div><div class="sl">${x.l}</div></div>`).join('');

  // State donut
  const stateOrder = ['Ready','Tracking','Idle','Offline','Unknown'];
  const stateData = stateOrder.filter(s=>states[s] && states[s]>0).map(s=>({l:s, v:states[s], c:stateColors[s]}));

  // Platform donut - sorted by count desc
  const platOrder = Object.entries(platforms).sort((a,b) => b[1]-a[1]);
  const platData = platOrder.map(([p,v],i) => ({l:p.toUpperCase(), v, c: platPalette[i % platPalette.length]}));

  // Camera type donut
  const camOrder = Object.entries(camTypes).sort((a,b) => b[1]-a[1]);
  const camData = camOrder.map(([c,v],i) => ({l:c.replace(/_/g,' '), v, c: camPalette[i % camPalette.length]}));

  function donutCard(title, data, total) {
    return `
      <div class="chart-card">
        <div class="ch"><h3>${title}</h3><span class="ch-sub">${total} total</span></div>
        <div class="chart-body">
          <div class="chart-wrap">
            <div class="chart-svg">${donutSvg(data.map(d=>({v:d.v,c:d.c})), total)}</div>
            <div class="legend">${data.map(d=>`<div class="leg-item"><div class="leg-dot" style="background:${d.c}"></div><span class="leg-label">${d.l}</span><span class="leg-val">${d.v}</span><span class="leg-pct">${(d.v/total*100).toFixed(1)}%</span></div>`).join('')}</div>
          </div>
        </div>
      </div>`;
  }

  document.getElementById('content').innerHTML =
    donutCard('Devices by state', stateData, total) +
    donutCard('All devices by platform', platData, total) +
    donutCard('Device by camera type', camData, total);

  // Offline table
  document.getElementById('tableWrap').innerHTML = attention.length > 0 ? `
    <div class="tc">
      <div class="thdr">⚠ Devices needing attention <span class="sub">${attention.length} device${attention.length!==1?'s':''}</span></div>
      <table><thead><tr><th>Device</th><th>Venue</th><th>Location</th><th>State</th><th>Last seen</th></tr></thead>
      <tbody>${attention.map(d=>{
        const parts=(d.venue||'—').split('|');
        return `<tr><td style="font-family:monospace">${esc(d.aioo_id||d.mac||d.device||'—')}</td><td>${esc(parts[0]?.trim()||'—')}</td><td>${esc(parts.slice(1).join('|').trim()||'—')}</td><td class="st-o">OFFLINE</td><td>${esc(d.last_seen||'—')}</td></tr>`;
      }).join('')}</tbody></table>
    </div>` : '';
}

(async function(){
  try {
    const r = await fetch(API_URL,{headers:{'client_id':CLIENT_ID,'client_secret':CLIENT_SECRET,'Accept':'application/json'}});
    if (!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  } catch(e){
    document.getElementById('ts').textContent = 'Error: '+e.message;
  }
  setInterval(async function(){
    try {
      const r = await fetch(API_URL,{headers:{'client_id':CLIENT_ID,'client_secret':CLIENT_SECRET,'Accept':'application/json'}});
      if (r.ok) render(await r.json());
    } catch(e){}
  },300000);
})();
</script>
</body>
</html>
