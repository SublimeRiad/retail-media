name: Update All Dashboards

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  build-all-dashboards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p /tmp/rmstatus-light

      - name: Fetch IoT data from API
        env:
          AIOO_CLIENT_ID: ${{ secrets.AIOO_CLIENT_ID }}
          AIOO_CLIENT_SECRET: ${{ secrets.AIOO_CLIENT_SECRET }}
        run: node iot-camera/scripts/fetch-iot-api.js

      - name: Build IoT Retail dashboards
        run: |
          node iot-camera/scripts/build-rmstatus.js
          node iot-camera/scripts/build-retailer.js
          node iot-camera/scripts/build-wall-dash.js

      - name: Build NSOC dashboards
        env:
          NSOC_CREDS: ${{ secrets.NSOC_CREDS }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          echo "$NSOC_CREDS" > ~/.nsoc_creds
          echo "$GRAFANA_TOKEN" > ~/.grafana_token
          python3 iot-camera/scripts/build-nsoc-dash.py
          python3 iot-camera/scripts/build-nsoc-black-screen.py

      - name: Build cron-status.html
        run: python3 iot-camera/scripts/build-cron-status.py

      - name: Copy & push all dashboards
        run: |
          cp /tmp/rmstatus-light/rmstatus.html $GITHUB_WORKSPACE/retailmedia.html
          cp /tmp/rmstatus-light/retailer.html $GITHUB_WORKSPACE/retailer.html
          cp /tmp/rmstatus-light/wall-dashboard.html $GITHUB_WORKSPACE/wall-dashboard.html
          cd $GITHUB_WORKSPACE
          git config user.name "iot-retail-bot"
          git config user.email "iot-retail-bot@aiootech.com"
          git add retailmedia.html retailer.html wall-dashboard.html cron-status.html
          git add Retail-Media-Nsoc-Players.html grafana-dashboards/nsoc-black-screen.html
          # Touch nsoc-operations-dashboard.html to force git update (client-side data)
          touch -m grafana-dashboards/nsoc-operations-dashboard.html
          git add grafana-dashboards/nsoc-operations-dashboard.html 2>/dev/null || true
          if git diff --staged --quiet; then
            # Keep-alive: force a timestamp commit even if nothing changed
            echo "keep-alive $(date '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive.txt
            git add .github/keepalive.txt
            git commit -m "Keep-alive $(date '+%Y-%m-%d %H:%M UTC')"
          else
            git commit -m "Auto-update all dashboards $(date '+%Y-%m-%d %H:%M UTC')"
          fi
          git pull origin master --rebase || true
          git push

      - name: Schedule next run in 10 min
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/SublimeRiad/retail-media/actions/workflows/update-iot-retail.yml/dispatches \
            -d '{"ref":"master"}'
