name: Update All Dashboards

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches:
      - 'ignore-me'  # disable push trigger — Pages Build only via workflow push

jobs:
  build-all-dashboards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p /tmp/rmstatus-light

      - name: Fetch IoT data from API
        env:
          AIOO_CLIENT_ID: ${{ secrets.AIOO_CLIENT_ID }}
          AIOO_CLIENT_SECRET: ${{ secrets.AIOO_CLIENT_SECRET }}
        run: node iot-camera/scripts/fetch-iot-api.js

      - name: Build IoT Retail dashboards
        run: |
          node iot-camera/scripts/build-rmstatus.js
          node iot-camera/scripts/build-retailer.js
          node iot-camera/scripts/build-wall-dash.js

      - name: Build cron-status.html
        run: python3 iot-camera/scripts/build-cron-status.py

      - name: Build NSOC dashboards
        continue-on-error: true
        env:
          NSOC_CREDS: ${{ secrets.NSOC_CREDS }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          echo "$NSOC_CREDS" > ~/.nsoc_creds
          echo "$GRAFANA_TOKEN" > ~/.grafana_token
          python3 iot-camera/scripts/build-nsoc-dash.py
          python3 iot-camera/scripts/build-nsoc-status.py
          python3 iot-camera/scripts/build-nsoc-black-screen.py

      - name: Push all dashboards (single commit)
        run: |
          cd $GITHUB_WORKSPACE
          # Copy IoT dashboards
          cp /tmp/rmstatus-light/rmstatus.html retailmedia.html
          cp /tmp/rmstatus-light/retailer.html retailer.html
          cp /tmp/rmstatus-light/wall-dashboard.html wall-dashboard.html
          # Copy NSOC dashboards (if they exist)
          ls /tmp/rmstatus-light/nsoc-status.html 2>/dev/null && cp /tmp/rmstatus-light/nsoc-status.html . || true
          ls /tmp/rmstatus-light/Retail-Media-Nsoc-Players.html 2>/dev/null && cp /tmp/rmstatus-light/Retail-Media-Nsoc-Players.html . || true
          ls /tmp/rmstatus-light/nsoc-black-screen.html 2>/dev/null && cp /tmp/rmstatus-light/nsoc-black-screen.html ./grafana-dashboards/ 2>/dev/null || true
          touch -m grafana-dashboards/nsoc-operations-dashboard.html 2>/dev/null
          # Stage all changes
          git config user.name "iot-retail-bot"
          git config user.email "iot-retail-bot@aiootech.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update all dashboards $(date '+%Y-%m-%d %H:%M UTC')"
            git push --force
            echo "✅ All dashboards pushed in single commit"
          else
            echo "ℹ️ No changes to push"
          fi


