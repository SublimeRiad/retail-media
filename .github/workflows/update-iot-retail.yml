name: Update All Dashboards

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  build-all-dashboards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p /tmp/rmstatus-light

      - name: Fetch IoT data from API
        env:
          AIOO_CLIENT_ID: ${{ secrets.AIOO_CLIENT_ID }}
          AIOO_CLIENT_SECRET: *** secrets.AIOO_CLIENT_SECRET }}
        run: node iot-camera/scripts/fetch-iot-api.js

      - name: Build IoT Retail dashboards
        run: |
          node iot-camera/scripts/build-rmstatus.js
          node iot-camera/scripts/build-retailer.js
          node iot-camera/scripts/build-wall-dash.js
          node iot-camera/scripts/build-cron-status.py

      - name: Build live-API dashboards (inline JS with credentials)
        run: |
          python3 iot-camera/scripts/build-wall-live.py
          python3 iot-camera/scripts/build-retailmedia-live.py

      - name: Push all dashboards
        run: |
          cd $GITHUB_WORKSPACE
          # Copy IoT dashboards
          cp /tmp/rmstatus-light/rmstatus.html retailmedia.html || true
          cp /tmp/rmstatus-light/retailer.html retailer.html || true
          cp /tmp/rmstatus-light/wall-dashboard.html wall-dashboard.html || true
          # Copy live-API dashboards (if built)
          cp /tmp/rmstatus-light/wall-live-api.html wall-live-api.html 2>/dev/null || true
          cp /tmp/rmstatus-light/retailmedia-live.html retailmedia-live.html 2>/dev/null || true
          # Stage all changes
          git config user.name "iot-retail-bot"
          git config user.email "iot-retail-bot@aiootech.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update all dashboards $(date '+%Y-%m-%d %H:%M UTC')"
            git push origin master
            echo "✅ All dashboards pushed"
          else
            echo "ℹ️ No changes to push"
          fi
