<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retail Media · Retailers</title>
<meta http-equiv="refresh" content="1800">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:#08080e;color:#f1f5f9;display:flex;flex-direction:column}
.d{padding:16px 24px;max-width:1920px;margin:0 auto;width:100%;height:100vh;display:flex;flex-direction:column}

.hd{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:16px}
.hd h1{font-size:22px;font-weight:700;color:#e2e8f0;letter-spacing:-.3px}
.hd h1 span{color:#52525b;font-weight:400}
.hd .ts{font-size:11px;color:#52525b;font-family:monospace}

/* Metric row */
.mr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;flex-shrink:0}
.mi{background:#111827;border:1px solid #1e293b;border-radius:8px;padding:12px 16px;text-align:center}
.mi .mv{font-size:26px;font-weight:800;line-height:1}
.mi .ml{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;font-weight:500}
.mi:nth-child(1) .mv{color:#60a5fa}
.mi:nth-child(2) .mv{color:#4ade80}
.mi:nth-child(3) .mv{color:#f87171}
.mi:nth-child(4) .mv{color:#a78bfa}

/* Hexagon grid — tight layout for 2 hexes */
.hg{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-start;gap:8px;flex:1;padding:20px 0}

.hex{width:340px;height:380px;position:relative;margin:0;flex-shrink:0}
.hex-inner{width:100%;height:100%;position:relative;-webkit-clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);border:2px solid;padding:55px 24px 20px;display:flex;flex-direction:column;align-items:center;transition:all .2s}
.hex-inner:hover{border-color:#fff !important;transform:scale(1.03)}
.hex-badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.hex-title{font-size:16px;font-weight:700;color:#e2e8f0;margin-bottom:4px;text-align:center}
.hex-total{font-size:36px;font-weight:800;color:#fff;line-height:1.2}
.hex-sub{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.hex-stores{display:flex;flex-direction:column;gap:4px;width:100%;padding:0 14px}
.hs{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:4px;border:1px solid;font-size:12px;transition:all .2s}
.hs:hover{background:rgba(255,255,255,.08)}
.hn{color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-weight:500}
.hv{font-weight:700;margin-left:8px}

.ft{flex-shrink:0;text-align:center;padding:8px;color:#1e293b;font-size:9px;border-top:1px solid #1e293b}

@media(max-width:768px){
  .mr{grid-template-columns:repeat(2,1fr)}
  .d{padding:12px}
  .hg{flex-wrap:wrap;gap:6px}
  .hex{width:280px;height:320px}
}
</style>
</head>
<body>
<div class="d">
<div class="hd"><h1>Retail Media <span>· Retailers</span></h1><div class="ts">30/06/2026 18:02:20</div></div>

<div class="mr">
  <div class="mi"><div class="mv">103</div><div class="ml">Total Devices</div></div>
  <div class="mi"><div class="mv">3</div><div class="ml">Offline</div></div>
  <div class="mi"><div class="mv">2</div><div class="ml">Retailers</div></div>
  <div class="mi"><div class="mv">3</div><div class="ml">Stores</div></div>
</div>

<div class="hg">
<div class="hex">
  <div class="hex-inner" style="background:#2a0a0a;border-color:#ef4444">
    <div class="hex-badge" style="background:#7f1d1d">UC</div>
    <div class="hex-title">Union Coop</div>
    <div class="hex-total">60</div>
    <div class="hex-sub">2 stores · <span style="color:#f87171">3 offline</span></div>
    <div class="hex-stores"><div class="hs" style="border-color:#7f1d1d;background:#2a0a0a"><span class="hn">UMM SUQEIM</span><span class="hv" style="color:#f87171">1 offline</span></div><div class="hs" style="border-color:#7f1d1d;background:#2a0a0a"><span class="hn">AL WARQA</span><span class="hv" style="color:#f87171">2 offline</span></div></div>
  </div>
</div>
<div class="hex">
  <div class="hex-inner" style="background:#0a2e1a;border-color:#22c55e">
    <div class="hex-badge" style="background:#166534">LM</div>
    <div class="hex-title">Lulu</div>
    <div class="hex-total">43</div>
    <div class="hex-sub">1 store · <span style="color:#4ade80">all ok</span></div>
    <div class="hex-stores"><div class="hs" style="border-color:#166534;background:#0a2e1a"><span class="hn">LULU AL WAHDA</span><span class="hv" style="color:#4ade80">43 ok</span></div></div>
  </div>
</div>
</div>

<div class="ft">IOT Admin Console · AiOO Tech Dubai © · 30/06/2026 18:02:20</div>
</div>
</body>
</html>
