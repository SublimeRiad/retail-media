<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSOC Black Screen Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0b1120;color:#e2e8f0;font-family:'Inter',-apple-system,sans-serif;font-size:clamp(12px,1.1vw,16px)}
.dash{flex:1;display:flex;flex-direction:column;padding:clamp(8px,1vh,16px) clamp(12px,1.5vw,24px);gap:clamp(4px,0.6vh,10px);max-width:1920px;margin:0 auto;width:100%;height:100vh}

/* Header */
.hd{display:flex;align-items:center;gap:clamp(8px,1vw,14px);padding:clamp(6px,0.8vh,12px) clamp(10px,1.2vw,18px);background:#111827;border-radius:8px;border:1px solid #1f2b3e;flex-shrink:0}
.hd .dot{width:4px;height:clamp(18px,2.5vh,28px);background:#ef4444;border-radius:3px;flex-shrink:0}
.hd h1{font-size:clamp(14px,1.6vw,22px);font-weight:700;color:#ef4444;letter-spacing:-0.3px;white-space:nowrap}
.hd .sub{font-size:clamp(10px,1vw,14px);color:#64748b;padding-left:clamp(8px,1vw,14px);border-left:1px solid #1f2b3e;margin-left:clamp(8px,1vw,14px);white-space:nowrap}
.hd .ts{margin-left:auto;font-size:clamp(10px,0.9vw,13px);color:#64748b;font-family:monospace;white-space:nowrap}
.hd .mode{padding:2px 8px;border-radius:4px;font-size:clamp(8px,0.65vw,10px);font-weight:600;text-transform:uppercase}
.mode-live{background:rgba(34,197,94,.2);color:#22c55e}
.mode-fallback{background:rgba(245,158,11,.2);color:#f59e0b}

/* Stats */
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,0.6vw,10px);flex-shrink:0}
.sc{background:#111827;border-radius:8px;padding:clamp(8px,1.2vh,18px) clamp(10px,1.5vw,20px);border:1px solid #1f2b3e;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc-r::before{background:#ef4444}.sc-b::before{background:#3b82f6}.sc-o::before{background:#f59e0b}.sc-p::before{background:#a78bfa}
.sc .l{font-size:clamp(9px,0.8vw,11px);font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin-bottom:2px}
.sc .v{font-size:clamp(22px,3vw,36px);font-weight:700;letter-spacing:-1px;line-height:1.1}
.sc-r .v{color:#ef4444}.sc-b .v{color:#3b82f6}.sc-o .v{color:#f59e0b}.sc-p .v{color:#a78bfa}
.sc .m{font-size:clamp(9px,0.75vw,11px);color:#64748b;margin-top:2px}

/* Content panels */
.ct{flex:1;display:grid;grid-template-columns:1.8fr 1.2fr 3fr;gap:clamp(4px,0.6vw,10px);min-height:0}
.pa{background:#111827;border-radius:8px;border:1px solid #1f2b3e;display:flex;flex-direction:column;overflow:hidden}
.pa .ph{padding:clamp(4px,0.5vh,8px) clamp(8px,1vw,14px);border-bottom:1px solid #1f2b3e;flex-shrink:0}
.pa .ph h3{font-size:clamp(9px,0.75vw,11px);font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px}
.pa .ph h3 .cnt{font-weight:400;color:#64748b;font-size:0.85em}
.pa .pb{flex:1;overflow:hidden;position:relative}

/* Venue list */
.vlist{overflow-y:auto;height:100%;padding:4px 0}
.vrow{display:flex;align-items:center;padding:clamp(3px,0.3vh,5px) clamp(6px,0.7vw,10px);border-bottom:1px solid rgba(255,255,255,.03);gap:8px}
.vrow .vname{flex:1;font-size:clamp(9px,0.7vw,11px);color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .vbar{flex:2;height:clamp(10px,1.2vh,14px);background:#1a2332;border-radius:6px;overflow:hidden}
.vrow .vfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#ef4444,#dc2626);transition:width .3s}
.vrow .vcount{min-width:clamp(20px,2vw,30px);text-align:right;font-size:clamp(10px,0.8vw,13px);font-weight:600;color:#e2e8f0;font-family:monospace}

/* Type chart */
.type-list{overflow-y:auto;height:100%;padding:8px}
.type-item{display:flex;align-items:center;gap:8px;padding:clamp(4px,0.4vh,7px) 0;border-bottom:1px solid rgba(255,255,255,.03)}
.type-item:last-child{border:none}
.type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.type-name{flex:1;font-size:clamp(9px,0.7vw,11px);color:#94a3b8}
.type-val{font-size:clamp(10px,0.8vw,13px);font-weight:600;color:#e2e8f0;font-family:monospace}
.type-pct{font-size:clamp(8px,0.65vw,10px);color:#64748b;min-width:clamp(28px,2.5vw,38px);text-align:right}

/* Table */
.tb-wrap{overflow:auto;height:100%}
.tb{width:100%;border-collapse:collapse;font-size:clamp(9px,0.7vw,11px)}
.tb th{text-align:left;padding:clamp(3px,0.35vh,5px) clamp(6px,0.7vw,10px);color:#64748b;font-weight:500;font-size:clamp(8px,0.65vw,10px);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #1f2b3e;position:sticky;top:0;background:#111827;z-index:1}
.tb td{padding:clamp(3px,0.35vh,5px) clamp(6px,0.7vw,10px);border-bottom:1px solid rgba(255,255,255,.03);color:#94a3b8;white-space:nowrap}
.tb tr.hl td{background:rgba(239,68,68,.05)}
.tb bdg{display:inline-block;padding:1px 6px;border-radius:3px;font-size:clamp(8px,0.65vw,10px);font-weight:600}
.bg-r{background:rgba(239,68,68,.2);color:#ef4444}.bg-o{background:rgba(245,158,11,.2);color:#f59e0b}

.map-row{display:flex;gap:clamp(4px,0.6vw,10px);flex-shrink:0;height:clamp(120px,15vh,180px)}
.map-pa{flex:1;display:flex;flex-direction:column;background:#111827;border-radius:8px;border:1px solid #1f2b3e;overflow:hidden}
.map-pa .ph{padding:clamp(3px,0.4vh,6px) clamp(8px,1vw,14px);border-bottom:1px solid #1f2b3e;flex-shrink:0}
.map-pa .ph h3{font-size:clamp(9px,0.7vw,11px);font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px}
.map-pa .map-c{flex:1;min-height:0;width:100%}
.map-pa .leaflet-container{background:#0b1120}

@media(max-width:1200px){
  .ct{grid-template-columns:1fr}
  .map-row{flex-direction:column;height:auto}
  .map-row .map-c{height:150px}
}
</style>
</head>
<body>
<div class="dash">
  <div class="hd">
    <div class="dot"></div>
    <h1>NSOC Black Screen</h1>
    <div class="sub">Screens with black ratio ≥ 95%</div>
    <span class="mode mode-live" id="modeBadge">LIVE</span>
    <div class="ts" id="updateTime">—</div>
  </div>

  <div class="st">
    <div class="sc sc-r"><div class="l">Black Screens</div><div class="v" id="s1">—</div><div class="m">Screens affected</div></div>
    <div class="sc sc-b"><div class="l">Monitored</div><div class="v" id="s2">—</div><div class="m">Screens with script</div></div>
    <div class="sc sc-o"><div class="l">Locations</div><div class="v" id="s3">—</div><div class="m">Venues affected</div></div>
    <div class="sc sc-p"><div class="l">Venue Types</div><div class="v" id="s4">—</div><div class="m">Categories</div></div>
  </div>

  <div class="ct">
    <div class="pa">
      <div class="ph"><h3>Black Screens by Venue</h3></div>
      <div class="pb"><div class="vlist" id="venueList"></div></div>
    </div>
    <div class="pa">
      <div class="ph"><h3>By Venue Type</h3></div>
      <div class="pb"><div class="type-list" id="typeList"></div></div>
    </div>
    <div class="pa">
      <div class="ph"><h3>PC with Black Screen <span class="cnt" id="pcCnt"></span></h3></div>
      <div class="tb-wrap" id="tableWrap">
        <table class="tb"><thead><tr><th>PC Name</th><th>Venue</th><th>Type</th><th>Ratio</th></tr></thead><tbody id="tableBody"></tbody></table>
      </div>
    </div>
  </div>

  <div class="map-row">
    <div class="map-pa"><div class="ph"><h3>Dubai</h3></div><div id="dubaiMap" class="map-c"></div></div>
    <div class="map-pa"><div class="ph"><h3>Abu Dhabi</h3></div><div id="abuDhabiMap" class="map-c"></div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== STATIC FALLBACK DATA =====
const FALLBACK = {
  stats: {blackTotal:34, monitored:1227, venues:16, venueTypes:5},
  venues: [
    {venue:'ENOC Dubai',count:3},{venue:'REEM MALL',count:5},{venue:'Dalma Mall',count:4},
    {venue:'EXPOCITY',count:3},{venue:'YAS Mall',count:2},{venue:'NAKHEEL MALL',count:2},
    {venue:'ENOC Umm Al Quwain',count:1},{venue:'IBN BATTUTA Mall',count:1},{venue:'Abu Dhabi Mall',count:1},
    {venue:'Union Coop AL BARSHA',count:1},{venue:'Mushrif Mall',count:1},{venue:'The Gardens',count:1},
    {venue:'JABEL ALI DXB',count:1},{venue:'PALM-DUBAI ZUMUROD',count:1},{venue:'Jumeirah Golf Estate',count:1},
    {venue:'The WTC MALL',count:1}
  ],
  types: [
    {type:'Malls',count:19},{type:'Convenience Stores',count:5},{type:'Outdoor',count:4},
    {type:'In-Store',count:1},{type:'Metro',count:2},{type:'Unknown',count:3}
  ],
  pcs: [
    {pc:'DESKTOP-EFLKTKP',venue:'ENOC Dubai',type:'Convenience Stores',ratio:1,playerid:'1017-PELMET'},
    {pc:'PC-E454E8CBE81A',venue:'ENOC Umm Al Quwain',type:'Convenience Stores',ratio:1,playerid:'1301-PELMET'},
    {pc:'PC-E454E8CBE853',venue:'ENOC Dubai',type:'Convenience Stores',ratio:1,playerid:'1069-PELMET'},
    {pc:'PC-94C6911FB145',venue:'IBN BATTUTA Mall',type:'Malls',ratio:1,playerid:'1259843380'},
    {pc:'AUH-DDP-4A',venue:'Abu Dhabi Mall',type:'Malls',ratio:1,playerid:'1230684793'},
    {pc:'DESKTOP-R8SI3CH',venue:'YAS Mall',type:'Malls',ratio:1,playerid:'1307404912'},
    {pc:'DESKTOP-05E81SO',venue:'YAS Mall',type:'Malls',ratio:1,playerid:'587479136'},
    {pc:'PC-00E04C01578B',venue:'NAKHEEL MALL',type:'Malls',ratio:1,playerid:'895330458'},
    {pc:'DESKTOP-8HGL0S0',venue:'EXPOCITY',type:'Outdoor',ratio:1,playerid:'713572909'},
    {pc:'DESKTOP-66E39U2',venue:'EXPOCITY',type:'Outdoor',ratio:1,playerid:'714355354'},
    {pc:'DESKTOP-5K9INR3',venue:'EXPOCITY',type:'Outdoor',ratio:1,playerid:'714357589'},
    {pc:'COLUMN-10',venue:'REEM MALL',type:'Malls',ratio:1,playerid:'973850861'},
    {pc:'DESKTOP-1GEV8UL',venue:'EXPOCITY',type:'Outdoor',ratio:1,playerid:'1077605994'},
    {pc:'PC-00018087DEF8',venue:'ENOC Dubai',type:'Convenience Stores',ratio:1,playerid:'1017-POST-R'},
    {pc:'BARSHA-H-E',venue:'Union Coop AL BARSHA',type:'In-Store',ratio:1,playerid:'844741833'},
    {pc:'ALWSL-TOTEM2B-EXPCT',venue:'—',type:'—',ratio:1,playerid:'ALWSL-TOTEM2B-E'},
    {pc:'PC-00E04C0157EE',venue:'NAKHEEL MALL',type:'Malls',ratio:1,playerid:'0'},
    {pc:'PC-E43A6E5D688F',venue:'REEM MALL',type:'Malls',ratio:1,playerid:'983420635'},
    {pc:'PC-E43A6E5F25DF',venue:'REEM MALL',type:'Malls',ratio:1,playerid:'973368453'},
    {pc:'PC-E43A6E39A29A',venue:'REEM MALL',type:'Malls',ratio:1,playerid:'973368985'},
    {pc:'PC-E43A6E39B925',venue:'REEM MALL',type:'Malls',ratio:1,playerid:'927850022'},
    {pc:'PC-88AEDD07261B',venue:'Dalma Mall',type:'Malls',ratio:1,playerid:'1154787954'},
    {pc:'PC-CC28AA47305C',venue:'Mushrif Mall',type:'Malls',ratio:1,playerid:'1244473332'},
    {pc:'PC-88AEDD01E257',venue:'Dalma Mall',type:'Malls',ratio:1,playerid:'1154787203'},
    {pc:'PC-1C697A606AE6',venue:'The Gardens',type:'Metro',ratio:1,playerid:'1284590250'},
    {pc:'DM-SZRB-JAB-DXB',venue:'JABEL ALI DXB',type:'Outdoor',ratio:1,playerid:'1359803639'},
    {pc:'Burjuman-HOLOGRAM-S1-2300002',venue:'—',type:'—',ratio:1,playerid:'BURJUMAN-HOLOGR'},
    {pc:'MEGACOM-07',venue:'PALM-DUBAI ZUMUROD',type:'—',ratio:1,playerid:'1266055281'},
    {pc:'PC-88AEDD01E2B7',venue:'Dalma Mall',type:'Malls',ratio:1,playerid:'1169407680'},
    {pc:'PC-88AEDD021336',venue:'Dalma Mall',type:'Malls',ratio:1,playerid:'1152880722'},
    {pc:'MOEHLGPC02',venue:'—',type:'—',ratio:1,playerid:'MOEHLGPC02'},
    {pc:'MEGACOM-9',venue:'—',type:'—',ratio:1,playerid:'MEGACOM-9'},
    {pc:'PC-1C697A606C40',venue:'Jumeirah Golf Estate',type:'Metro',ratio:1,playerid:'1275930633'},
    {pc:'PC-00E04C68082D',venue:'The WTC MALL',type:'Malls',ratio:1,playerid:'1155822611'}
  ]
};

// ===== PUBLIC API (via NUC tunnel with CORS) =====
const API_BASE = 'https://e9d665b3df6b69.lhr.life';

async function fetchJSON(url) {
  const r = await fetch(API_BASE + url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

async function fetchBlackStats() {
  return fetchJSON('/api/black-screen-stats');
}

async function fetchMonitored() {
  return fetchJSON('/api/black-screen-stats');
}

async function fetchVenues() {
  return fetchJSON('/api/black-screen-stats');
}

async function fetchTypes() {
  return fetchJSON('/api/black-screen-stats');
}

async function fetchVenuesList() {
  return fetchJSON('/api/black-screen-venues');
}

async function fetchTypesList() {
  return fetchJSON('/api/black-screen-types');
}

async function fetchPCs() {
  return fetchJSON('/api/black-screen-pcs');
}

// ===== STATE =====
let isLive = false;
let pcs = [];
let page = 0, rowsPerPage = 8, scrollTimer = null;

// ===== TYPE COLORS =====
const TC = {'Convenience Stores':'#22c55e','In-Store':'#ec4899','Malls':'#3b82f6','Outdoor':'#f59e0b','Metro':'#a78bfa'};
const TD = {'Convenience Stores':0,'In-Store':1,'Malls':2,'Outdoor':3,'Metro':4};

// ===== RENDER =====
function renderStats(d) {
  document.getElementById('s1').textContent = d.blackTotal;
  document.getElementById('s2').textContent = d.monitored;
  document.getElementById('s3').textContent = d.venues;
  document.getElementById('s4').textContent = d.venueTypes;
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('en-GB',{hour12:false});
}

function renderVenues(list) {
  const max = Math.max(...list.map(v=>v.count), 1);
  const el = document.getElementById('venueList');
  el.innerHTML = list.map(v =>
    `<div class="vrow"><span class="vname">${v.venue}</span><div class="vbar"><div class="vfill" style="width:${(v.count/max*100).toFixed(0)}%"></div></div><span class="vcount">${v.count}</span></div>`
  ).join('');
}

function renderTypes(list) {
  const total = list.reduce((s,t)=>s+t.count, 0);
  const el = document.getElementById('typeList');
  el.innerHTML = list.sort((a,b)=>TD[a.type]!==undefined&&TD[b.type]!==undefined?TD[a.type]-TD[b.type]:b.count-a.count).map(t =>
    `<div class="type-item"><span class="type-dot" style="background:${TC[t.type]||'#64748b'}"></span><span class="type-name">${t.type}</span><span class="type-val">${t.count}</span><span class="type-pct">${(t.count/total*100).toFixed(0)}%</span></div>`
  ).join('');
}

function renderTable() {
  const start = page * rowsPerPage;
  const pg = pcs.slice(start, start + rowsPerPage);
  document.getElementById('pcCnt').textContent = `(${pcs.length} total)`;
  document.getElementById('tableBody').innerHTML = pg.map(p =>
    `<tr${p.ratio===1?' class="hl"':''}><td style="font-weight:500;color:#e2e8f0">${p.pc}</td><td>${p.venue}</td><td>${p.type}</td><td><span class="bdg ${p.ratio>=1?'bg-r':'bg-o'}">${(p.ratio*100).toFixed(0)}%</span></td></tr>`
  ).join('');
}

function startAutoScroll() {
  if (scrollTimer) clearInterval(scrollTimer);
  scrollTimer = setInterval(() => {
    const total = Math.ceil(pcs.length / rowsPerPage);
    page = (page + 1) % total;
    renderTable();
    document.getElementById('tableWrap').scrollTop = 0;
  }, 4000);
}

function loadData(data) {
  renderStats(data.stats);
  renderVenues(data.venues);
  renderTypes(data.types);
  pcs = data.pcs;
  page = 0;
  renderTable();
  startAutoScroll();
}

// ===== FETCH =====
async function tryFetch() {
  const badge = document.getElementById('modeBadge');
  try {
    const [statsData, venuesList, typesList, pcsData] = await Promise.all([
      fetchJSON('/api/black-screen-stats'),
      fetchVenuesList(),
      fetchTypesList(),
      fetchPCs()
    ]);
    loadData({
      stats: {blackTotal: statsData.blackTotal, monitored: statsData.monitored, venues: statsData.venues, venueTypes: statsData.venueTypes},
      venues: venuesList,
      types: typesList,
      pcs: pcsData
    });
    badge.textContent = 'LIVE';
    badge.className = 'mode mode-live';
    isLive = true;
  } catch(e) {
    console.log('Live data unavailable, using static data:', e.message);
    loadData(FALLBACK);
    badge.textContent = 'STATIC';
    badge.className = 'mode mode-fallback';
  }
  // Refresh every 5 min
  setTimeout(tryFetch, 300000);
}

// ===== MAPS =====
function initMaps(){
  const dubaiMarkers = [
    [25.197,55.274],[25.204,55.271],[25.211,55.288],[25.235,55.300],[25.190,55.260],
    [25.226,55.308],[25.170,55.240],[25.215,55.280],[25.200,55.265],[25.188,55.250],
    [25.220,55.290],[25.240,55.310],[25.230,55.295],[25.250,55.320],[25.175,55.255]
  ];
  const abuMarkers = [
    [24.453,54.377],[24.460,54.370],[24.470,54.385],[24.440,54.360],[24.480,54.390],
    [24.445,54.365],[24.455,54.375],[24.465,54.382],[24.475,54.395],[24.450,54.372]
  ];
  
  function initMap(id,center,markers){
    const m = L.map(id,{
      center,zoom:12,
      layers:[L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19})],
      zoomControl:false,attributionControl:false
    });
    markers.forEach(p=>{
      L.circleMarker(p,{radius:6,fillColor:'#ef4444',color:'#fff',weight:1.5,opacity:0.8,fillOpacity:0.5}).addTo(m);
    });
  }
  initMap('dubaiMap',[25.18,55.28], dubaiMarkers);
  initMap('abuDhabiMap',[24.46,54.38], abuMarkers);
}

tryFetch();
initMaps();
</script>
</body>
</html>
