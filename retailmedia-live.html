<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retail Media · IoT Status</title>
<meta http-equiv="refresh" content="300">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:#08080e;color:#f1f5f9;display:flex;flex-direction:column;font-size:clamp(12px,1.1vw,16px)}
.d{display:flex;flex-direction:column;padding:clamp(10px,1.2vh,20px) clamp(16px,2vw,32px);gap:clamp(6px,0.8vh,14px);max-width:1920px;margin:0 auto;width:100%;height:100vh}
.hd{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hd h1{font-size:clamp(16px,1.8vw,26px);font-weight:700;color:#e2e8f0;letter-spacing:-.3px}
.hd h1 span{color:#52525b;font-weight:400}
.hd .ts{font-size:clamp(9px,0.8vw,12px);color:#52525b;font-family:monospace}
.mr{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(4px,0.5vw,10px);flex-shrink:0}
.mi{background:#111827;border:1px solid #1e293b;border-radius:8px;padding:clamp(8px,1vh,16px) clamp(10px,1vw,18px)}
.mi .mv{font-size:clamp(20px,2.5vw,36px);font-weight:800;line-height:1}
.mi .ml{font-size:clamp(8px,0.7vw,10px);color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:500}
.mi:nth-child(1) .mv{color:#60a5fa}
.mi:nth-child(2) .mv{color:#4ade80}
.mi:nth-child(3) .mv{color:#facc15}
.mi:nth-child(4) .mv{color:#f87171}
.mi:nth-child(5) .mv{color:#a78bfa}
.mi:nth-child(6) .mv{color:#f472b6}
.br{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,0.5vw,10px);flex:1;min-height:0}
.bc{border-radius:10px;overflow:hidden;border:1px solid #1e293b;display:flex;flex-direction:column}
.bc .bh{display:flex;align-items:center;padding:clamp(8px,0.8vh,14px) clamp(12px,1.2vw,18px);background:#111827;gap:8px;flex-shrink:0}
.bc .bh .bl{width:clamp(22px,1.8vw,30px);height:clamp(22px,1.8vw,30px);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(11px,0.9vw,14px);color:#fff;flex-shrink:0}
.bc .bh .uc{background:#2563eb}.bc .bh .lm{background:#dc2626}
.bc .bh h2{font-size:clamp(12px,1vw,16px);font-weight:700;color:#e2e8f0}
.bc .bh .bs{margin-left:auto;font-size:clamp(9px,0.7vw,11px);color:#64748b}
.bc .bh .bs b{color:#e2e8f0;font-weight:700}
.bc .bh .bs .gr{color:#4ade80}
.bc .bb{flex:1;overflow-y:auto;padding:clamp(8px,0.6vh,12px) clamp(12px,1.2vw,18px);background:#0f1117;display:flex;flex-direction:column;gap:clamp(6px,0.5vh,10px)}
.sv{border-radius:8px;padding:clamp(8px,0.6vh,12px) clamp(10px,0.8vw,14px);border:1px solid #1e293b}
.sv.ye{border-color:#5c4a00;background:linear-gradient(135deg,#2a2000 0%,#1a1500 100%)}
.sv.re{border-color:#7f1d1d;background:linear-gradient(135deg,#2a0a0a 0%,#1a0808 100%)}
.sv.gr{border-color:#166534;background:linear-gradient(135deg,#0a2e1a 0%,#0a1f12 100%)}
.sv .svh{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(4px,0.3vh,6px)}
.sv .svh .sn{font-size:clamp(11px,0.9vw,14px);font-weight:600;color:#e2e8f0}
.sv .svh .sn .loc{display:block;font-size:clamp(8px,0.6vw,10px);color:#64748b;font-weight:400;margin-top:1px}
.sv .svh .sc{font-size:clamp(11px,0.9vw,14px);font-weight:700;color:#94a3b8}
.sv .sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.sv .si{background:rgba(15,17,23,.5);border-radius:6px;padding:clamp(5px,0.4vh,8px) 0;text-align:center;border:1px solid rgba(45,55,72,.4)}
.sv .si .il{font-size:clamp(7px,0.55vw,9px);text-transform:uppercase;color:#64748b;letter-spacing:.5px}
.sv .si .iv{font-size:clamp(16px,1.4vw,22px);font-weight:800;margin-top:1px;line-height:1}
.sv .si .iv.gr{color:#4ade80}.sv .si .iv.ye{color:#facc15}.sv .si .iv.re{color:#f87171}
.al{flex-shrink:0;border-top:1px solid #1e293b;padding:clamp(6px,0.5vh,10px) 0 0}
.al .ah{display:flex;align-items:center;gap:6px;font-size:clamp(10px,0.8vw,12px);font-weight:600;color:#f87171;margin-bottom:clamp(4px,0.3vh,6px)}
.al .ah .ac{margin-left:auto;background:#1a0a0a;color:#f87171;padding:0 10px;border-radius:10px;font-size:clamp(8px,0.65vw,10px)}
.al table{width:100%;border-collapse:collapse;font-size:clamp(9px,0.7vw,11px)}
.al th{padding:clamp(3px,0.2vh,5px) clamp(6px,0.5vw,10px);color:#52525b;font-weight:500;text-align:left;font-size:clamp(7px,0.55vw,9px);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #1e293b}
.al td{padding:clamp(3px,0.2vh,5px) clamp(6px,0.5vw,10px);border-bottom:1px solid rgba(255,255,255,.03);color:#94a3b8}
.al .st{color:#f87171;font-weight:600}
</style>
</head>
<body>
<div class="d">
<div class="hd"><h1>Retail Media <span>· IoT Status</span></h1><div style="display:flex;align-items:center;gap:12px"><div class="ts" id="ts">Loading...</div></div></div>
<div class="mr" id="statsBar"></div>
<div class="br" id="brands"></div>
<div class="al" id="attention"></div>
</div>

<script>
const CLIENT_ID = 'b13b77ae-3d68-4560-9bf0-5de9780218b2';
const CLIENT_SECRET = '***';
const API_URL = 'https://apim-eu-1.aiootech.com/v1/iot/status/current';

function esc(s) { return s ? String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]) : ''; }
function $(id) { return document.getElementById(id); }

function parseDate(s) {
  if (!s) return 0;
  const m = s.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)/);
  return m ? new Date(m[3],m[2]-1,m[1],m[4],m[5],m[6]).getTime() : 0;
}

function render(devices) {
  const now = new Date().toLocaleString('en-GB',{timeZone:'Asia/Dubai',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' GST';
  $('ts').textContent = 'Last update: '+now;

  // Filter: only Union Coop and Lulu devices
  const retail = devices.filter(d => {
    const v = (d.venue||'').toLowerCase();
    return v.includes('union coop') || v.includes('lulu al wahda');
  });

  const total = retail.length;

  // Count states
  let tracking=0, warnings=0, errors=0, offline=[];
  for (const d of retail) {
    const s = d.state || '';
    if (s === 'Tracking' || s === 'Ready') tracking++;
    if ((d.monitoring_status||'').toLowerCase() === 'error' || (d.logger_status||'').toLowerCase() === 'error') errors++;
    if (s === 'Offline') offline.push(d);
  }

  // Group by venue
  const venueMap = {};
  for (const d of retail) {
    const v = (d.venue || '').split('|')[0].trim();
    venueMap[v] = venueMap[v] || { total:0, tracking:0, errors:0, offline:0 };
    venueMap[v].total++;
    const s = d.state || '';
    if (s === 'Tracking' || s === 'Ready') venueMap[v].tracking++;
    if ((d.monitoring_status||'').toLowerCase() === 'error' || (d.logger_status||'').toLowerCase() === 'error') venueMap[v].errors++;
    if (s === 'Offline') venueMap[v].offline++;
  }

  // Brand grouping
  const unionV = {}, luluV = {};
  for (const [v, c] of Object.entries(venueMap)) {
    if (v.toLowerCase().includes('lulu')) luluV[v] = c;
    else unionV[v] = c;
  }

  const unionTotal = Object.values(unionV).reduce((s,c) => s+c.total, 0);
  const unionOk = Object.values(unionV).reduce((s,c) => s+(c.total - c.offline), 0);
  const luluTotal = Object.values(luluV).reduce((s,c) => s+c.total, 0);
  const luluOk = Object.values(luluV).reduce((s,c) => s+(c.total - c.offline), 0);

  // Platform detection (sample)
  const plat = retail.length ? (retail[0].platform||'J30').toUpperCase() : 'J30';

  // Stats bar
  $('statsBar').innerHTML = `
    <div class="mi"><div class="mv">${total}</div><div class="ml">Total Devices · ${Object.keys(venueMap).length} venues</div></div>
    <div class="mi"><div class="mv">${tracking}</div><div class="ml">Tracking OK</div></div>
    <div class="mi"><div class="mv">${warnings}</div><div class="ml">Warnings</div></div>
    <div class="mi"><div class="mv">${errors}</div><div class="ml">Errors</div></div>
    <div class="mi"><div class="mv">~${total ? Math.round((total-offline.length)/total*100) : 0}%</div><div class="ml">Avg Uptime</div></div>
    <div class="mi"><div class="mv">${plat}</div><div class="ml">Platform</div></div>
  `;

  // Brand cards
  function brandCard(title, letter, colorClass, venueData, total, ok) {
    const sorted = Object.entries(venueData).sort((a,b) => b[1].total - a[1].total);
    return `
      <div class="bc">
        <div class="bh"><div class="bl ${colorClass}">${letter}</div><h2>${title}</h2><div class="bs"><b>${total}</b> devices · <b class="gr">${ok}</b> ok</div></div>
        <div class="bb">${sorted.map(([name, c]) => {
          const hasError = c.errors > 0;
          const svClass = hasError ? 're' : 'gr';
          const shortName = name.replace(/^(In-Store - |Malls - )/, '').replace(/( Union Coop| Lulu Market| LULU)/, '');
          return `<div class="sv ${svClass}">
            <div class="svh"><span class="sn">${esc(shortName)} <span class="loc">${esc(title)}</span></span><span class="sc">${c.total}</span></div>
            <div class="sg">
              <div class="si"><div class="il">Tracking</div><div class="iv gr">${c.tracking}</div></div>
              <div class="si"><div class="il">Warnings</div><div class="iv gr">0</div></div>
              <div class="si"><div class="il">Errors</div><div class="iv ${hasError ? 're' : 'gr'}">${c.errors}</div></div>
            </div>
          </div>`;
        }).join('')}</div>
      </div>`;
  }

  $('brands').innerHTML =
    brandCard('Union Coop', 'U', 'uc', unionV, unionTotal, unionOk) +
    brandCard('Lulu Market', 'L', 'lm', luluV, luluTotal, luluOk);

  // Attention table
  offline.sort((a,b) => parseDate(b.last_seen)-parseDate(a.last_seen));
  const attention = offline.slice(0, 20);

  $('attention').innerHTML = attention.length > 0 ? `
    <div class="ah">⚠ Devices needing attention <span class="ac">${attention.length}</span></div>
    <table><tr><th>Venue / Asset</th><th>Device</th><th>State</th><th>Last seen</th></tr>
      ${attention.map(d => {
        const v = (d.venue || '').split('|')[0].trim();
        return `<tr>
          <td><div style="font-weight:500;color:#e2e8f0;font-size:clamp(9px,0.7vw,11px)">${esc(v)}</div></td>
          <td style="font-family:'SF Mono',Consolas,monospace;color:#94a3b8;font-size:clamp(8px,0.65vw,10px)">${esc(d.aioo_id||d.mac||d.device||'—')}</td>
          <td><span class="st">Offline</span></td>
          <td style="color:#64748b">${esc(d.last_seen||'—')}</td>
        </tr>`;
      }).join('')}
    </table>` : '<div class="ah">⚠ All devices OK</div>';
}

(async function(){
  try {
    const r = await fetch(API_URL,{headers:{'client_id':CLIENT_ID,'client_secret':CLIENT_SECRET,'Accept':'application/json'}});
    if (!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  } catch(e){
    $('ts').textContent = 'Error: '+e.message;
  }
  setInterval(async function(){
    try {
      const r = await fetch(API_URL,{headers:{'client_id':CLIENT_ID,'client_secret':CLIENT_SECRET,'Accept':'application/json'}});
      if (r.ok) render(await r.json());
    } catch(e){}
  },300000);
})();
</script>
</body>
</html>
